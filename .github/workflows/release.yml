name: Build and Release

on:
  push:
    tags: ['v*']

# Fix: grant write permission so GITHUB_TOKEN can create releases
permissions:
  contents: write

jobs:
  #  Linux + Windows (cross-compile) 
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            mingw-w64-tools \
            librsvg2-bin \
            imagemagick \
            nsis

      - name: Generate icons
        run: make icons

      - name: Build Linux binary
        run: |
          gcc -std=c11 -O2 -static \
            -o ys-linux \
            lexer.c parser.c eval.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm
          chmod +x ys-linux

      - name: Build Windows binary
        run: make windows

      - name: Build Windows GUI installer (NSIS)
        run: |
          # makensis expects ys.exe and icons/ys.ico in the working dir
          makensis installer.nsi
          echo "Installer built: yolish-setup.exe"
          ls -lh yolish-setup.exe

      - name: Build VS Code extension (.vsix)
        run: |
          npm install -g @vscode/vsce
          cd vscode-extension/extension
          vsce package --no-dependencies
          mv yolish-*.vsix ../../

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Yolish ${{ github.ref_name }}"
          body: |
            ## Yolish ${{ github.ref_name }}

            ### Download

            | Platform | File |
            |----------|------|
            | Windows x64 installer | [`yolish-setup.exe`](../../releases/download/${{ github.ref_name }}/yolish-setup.exe) — Next/Next/Finish, auto-adds to PATH |
            | Windows x64 binary (manual) | [`ys.exe`](../../releases/download/${{ github.ref_name }}/ys.exe) |
            | Linux x64 | [`ys-linux`](../../releases/download/${{ github.ref_name }}/ys-linux) |
            | macOS x64 | [`ys-macos`](../../releases/download/${{ github.ref_name }}/ys-macos) |
            | VS Code extension | [`yolish-*.vsix`](../../releases/download/${{ github.ref_name }}/yolish-2.6.0.vsix) |

            ### Install

            **Windows** (PowerShell as Admin):
            ```powershell
            powershell -ExecutionPolicy Bypass -File .\install.ps1
            ```

            **Linux / macOS:**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | sh
            ```

            **VS Code extension:**
            ```
            Extensions → ⋯ → Install from VSIX → yolish-*.vsix
            ```
            or:
            ```cmd
            code --install-extension yolish-2.6.0.vsix
            ```

            ### What's new in ${{ github.ref_name }}

            - **v1.1** Float arithmetic (SSE2) + array literals in native compiler
            - **v1.2** File I/O — `y.fs.*` (read, write, append, exists, list, mkdir, delete, rename, size, is_dir)
            - **v1.3** Process & system — `process.spawn`, `process.env`, `sys.exit`, `sys.platform`
            - **v1.4** Error messages — `file:line:col` format with typo suggestions
            - **v1.5** Garbage Collector — mark-and-sweep GC, `gc.collect()`, `gc.stats()`
            - **v2.1** Tooling — `ys test` (test runner), `ys fmt` (formatter), `ys check` (static analysis)
            - **v2.3** Scalability — dynamic node pool, 1024-element arrays, O(1) amortized push/pop
            - **v2.4** Unlimited strings (heap-allocated); fixed critical closure-corruption bug from v1.5
            - **v2.5** Unlimited variables per scope (dynamic Env); fixed y.replace/y.join/y.reverse/y.index_of short-name aliases
            - **v2.0** Experimental bytecode VM (`ys vm file.y`) — 35-40x faster on recursive workloads, falls back cleanly for unsupported constructs
            - **v1.6** Module system — relative imports (`./utils.y`), circular detection, caching
            - **v1.7** Stdlib — `y.json`, `y.time`, `y.env`, `y.path`
            - **v2.2** Enums — `enum Direction { North South East West }` with match integration

            ### Usage
            ```
            ys hello.y          run a file
            ys -c hello.y       compile to native binary
            ys                  REPL
            ```
          files: |
            ys-linux
            ys.exe
            yolish-setup.exe
            install.ps1
            install.sh
            icons/logo.svg
            yolish-*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #  macOS 
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS binary
        run: |
          gcc -std=c11 -O2 \
            -o ys-macos \
            lexer.c parser.c eval.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm
          chmod +x ys-macos

      - name: Upload macOS binary
        uses: softprops/action-gh-release@v2
        with:
          files: ys-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}