name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          gcc -std=c11 -Wall -O2 \
            -o ys \
            lexer.c parser.c eval.c net_runtime.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm

      - name: Test — basic interpreter
        run: |
          echo 'y.println("hello")' | ./ys /dev/stdin | grep -q "hello"
          echo "y.println(1 + 2)" | ./ys /dev/stdin | grep -q "3"
          echo "y.println(2 * 21)" | ./ys /dev/stdin | grep -q "42"
          echo "PASS: basic interpreter"

      - name: Test — float arithmetic
        run: |
          echo "y.println(1.5 + 2.3)" | ./ys /dev/stdin | grep -q "3.8"
          echo "y.println(10.0 / 4.0)" | ./ys /dev/stdin | grep -q "2.5"
          echo "y.println(-3.14)" | ./ys /dev/stdin | grep -q "\-3.14"
          echo "PASS: float arithmetic"

      - name: Test — enums
        run: |
          printf 'enum Status { Ok NotFound Error }\ny.println(Status.Ok)\n' \
            | ./ys /dev/stdin | grep -q "Status.Ok"
          echo "PASS: enums"

      - name: Test — file I/O
        run: |
          printf 'y.fs.write("/tmp/ys_ci.txt","hello")\ny.println(y.fs.read("/tmp/ys_ci.txt"))\n' \
            | ./ys /dev/stdin | grep -q "hello"
          rm -f /tmp/ys_ci.txt
          echo "PASS: file I/O"

      - name: Test — JSON
        run: |
          printf 'let o = y.json.parse(`{"x":42}`)\ny.println(o.x)\n' \
            | ./ys /dev/stdin | grep -q "42"
          echo "PASS: JSON"

      - name: Test — modules (relative import)
        run: |
          echo 'fn greet(n){ y.println(n) }' > /tmp/utils_ci.y
          printf 'import "/tmp/utils_ci.y"\ngreet("ok")\n' \
            | ./ys /dev/stdin | grep -q "ok"
          rm -f /tmp/utils_ci.y
          echo "PASS: modules"

      - name: Test — process & system
        run: |
          echo 'y.println(sys.platform())' | ./ys /dev/stdin | grep -q "linux"
          echo "PASS: process & system"

      - name: Test — match + guards
        run: |
          printf 'let x = 5\nlet r = match x {\n  n if n > 3 => "big"\n  _ => "small"\n}\ny.println(r)\n' \
            | ./ys /dev/stdin | grep -q "big"
          echo "PASS: match guards"

      - name: Test — ys test command
        run: |
          # NOTE: this used to be a heredoc (cat > file << 'YSEOF' ... YSEOF)
          # with the body starting at column 0. That's invalid YAML: a
          # literal block scalar ("run: |" above) requires every line to
          # be indented at least as much as its first content line, or
          # the scalar ends early and the parser tries to read the next
          # line as a new top-level YAML key -- confirmed against two
          # independent parsers (PyYAML, js-yaml), both rejecting the
          # original file with a parse error, and matching a real,
          # publicly-documented GitHub Actions incident with this exact
          # shape (a workflow GitHub outright refused to run). Indenting
          # the heredoc body/delimiter to satisfy YAML doesn't work
          # either -- bash's own `<<'EOF'` requires the closing delimiter
          # alone on a line with no leading whitespace, so an indented
          # "YSEOF" is never recognized and the heredoc just keeps
          # consuming the rest of the step as content instead of ending.
          # printf with explicit \n, kept on one logical line, sidesteps
          # both problems at once.
          printf 'fn add(a, b) { return a + b }\ntest "add" {\n    assert_eq(add(2,3), 5)\n    assert(add(0,0) == 0)\n}\ntest "strings" {\n    assert(y.len("hello") == 5)\n}\n' \
            > /tmp/ci_test.y
          ./ys test /tmp/ci_test.y | grep -q "2 passed"
          echo "PASS: ys test"

      - name: Test — ys check command
        run: |
          printf 'let x = 10\ny.println(x)\n' > /tmp/ci_clean.y
          ./ys check /tmp/ci_clean.y | grep -q "No issues"
          echo "PASS: ys check"

      - name: Test — assert builtins
        run: |
          printf 'assert(1 == 1)\nassert_eq(2 + 2, 4)\nassert_true(true)\nassert_false(false)\ny.println("ok")\n' \
            | ./ys /dev/stdin | grep -q "ok"
          echo "PASS: assert builtins"

      - name: Test — native compiler (Linux ELF)
        run: |
          echo 'y.println("compiled!")' > /tmp/nc_test.y
          ./ys -c /tmp/nc_test.y -o /tmp/nc_test_bin
          /tmp/nc_test_bin | grep -q "compiled!"
          rm -f /tmp/nc_test.y /tmp/nc_test_bin
          echo "PASS: native compiler"

      - name: Test — native TLS public API (v2.30, real network)
        run: |
          # example.com specifically: IANA-maintained, about as stable a
          # real HTTPS target as exists, and (unlike some CDN frontends)
          # requires correct SNI to hand back a sensible response at all
          # -- see the v2.30 changelog entry for why that matters here.
          # \\r\\n below (doubled backslashes) is deliberate: printf's own
          # escape processing must turn each \\ into one literal backslash,
          # producing the literal two-character sequence \r in the
          # generated .y source, so Yolish's own string-literal lexer is
          # the thing that turns it into an actual CR byte at compile
          # time -- not printf doing that a layer too early.
          # maxlen=4000 (not the original 300): tls_recv_print is a
          # single read, by design (see the v2.31 changelog entry on why
          # the HTTP client needed its own read loop instead of reusing
          # this). A real run against example.com showed why 300 wasn't
          # enough: Cloudflare's header set plus chunked-transfer-encoding's
          # leading chunk-size line alone came close to that, cutting the
          # single read off before the actual "Example Domain" body ever
          # arrived -- a passing connect/handshake with a failing content
          # check, not a crash. 4000 leaves comfortable headroom under the
          # 4095-byte buffer cap.
          printf 'let h = y.net.tls_connect("example.com", 443)\ny.println(h)\nif h >= 0 {\n    y.net.tls_send(h, "GET / HTTP/1.1\\r\\nHost: example.com\\r\\nConnection: close\\r\\n\\r\\n")\n    y.net.tls_recv_print(h, 4000)\n    y.net.tls_close(h)\n}\n-- invalid handle must fail cleanly, not crash, on all three ops\ny.println(y.net.tls_send(99, "x"))\ny.println(y.net.tls_recv_print(99, 10))\ny.net.tls_close(99)\ny.println("done")\n' \
            > /tmp/tls_ci.y
          ./ys -c /tmp/tls_ci.y --target linux -o /tmp/tls_ci_bin
          out=$(timeout 20 /tmp/tls_ci_bin)
          echo "$out"
          echo "$out" | grep -q "^0$"              # tls_connect returned a valid handle
          echo "$out" | grep -qi "Example Domain"  # real decrypted response content
          echo "$out" | grep -q "^-1$"             # invalid-handle send/recv_print
          echo "$out" | grep -q "^done$"           # reached the end, no crash
          rm -f /tmp/tls_ci.y /tmp/tls_ci_bin
          echo "PASS: native TLS public API"

      - name: Test — bytecode VM (v2.0, experimental)
        run: |
          printf 'fn fib(n) {\n    if n <= 1 { return n }\n    return fib(n-1) + fib(n-2)\n}\ny.println(fib(10))\nlet arr = [1, 2, 3]\ny.println(arr[1])\nvar i = 0\nwhile i < 3 { i = i + 1 }\ny.println(i)\n' \
            > /tmp/vm_test.y
          ./ys vm /tmp/vm_test.y < /dev/null | grep -q "55"
          echo "PASS: bytecode VM"

      - name: Run examples
        run: |
          # </dev/null is critical: a few examples (e.g. input_and_types.y)
          # call y.input()/y.input_int()/y.input_float(), which block on
          # fread(stdin) waiting for a line. Without an explicit redirect,
          # the step inherits the runner's stdin, which may not signal EOF
          # immediately — that hung this exact job, with no error output,
          # until the workflow timed out. Forcing /dev/null guarantees an
          # instant EOF so input() returns an empty/default value instead
          # of blocking forever.
          for f in examples/*.y; do
            timeout 30 ./ys "$f" < /dev/null > /dev/null 2>&1 && echo "PASS: $f" || echo "FAIL: $f (non-zero exit)"
          done

      - name: Windows cross-compile sanity check
        run: |
          # Not a behavior test (nothing here can run a PE32+ binary on a
          # Linux runner) -- just confirms `make windows` still produces a
          # valid Windows executable. v2.26's whole changelog entry is a
          # build fix for exactly this silently breaking (a Linux-only
          # header pulled in by code that gets compiled for every target
          # regardless of what it emits) -- same risk any new native
          # builtin, TLS included, reintroduces if it isn't checked here.
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
          make windows
          file ys.exe | grep -q "PE32+"
          echo "PASS: windows cross-compile"

      - name: macOS target compile-only sanity check
        run: |
          # This job runs on ubuntu-latest and can't execute a Mach-O
          # binary -- it only confirms the compiler emits a structurally
          # valid one. Real execution happens in the separate
          # test-macos job below, on an actual macOS runner -- see that
          # job for what genuine verification of the v2.34 port
          # actually looks like.
          printf 'let s = y.net.connect("93.184.216.34", 80)\ny.println(s)\n' > /tmp/macos_ci.y
          ./ys -c /tmp/macos_ci.y --target macos -o /tmp/macos_ci_bin
          file /tmp/macos_ci_bin | grep -q "Mach-O"
          rm -f /tmp/macos_ci.y /tmp/macos_ci_bin
          echo "PASS: macos target produces a valid Mach-O binary"

  test-macos:
    # Real execution of the v2.34 macOS native-networking port, on an
    # actual macOS runner -- the first time any of that code has ever
    # run, anywhere, against a real kernel. Everything in this job was
    # unverified before it existed; a green run here is what actually
    # answers the open question the v2.34 changelog entry left on the
    # table, not just "the compiler emits the intended bytes."
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build ys (native macOS host build)
        run: |
          cc -std=c11 -Wall -O2 \
            -o ys \
            lexer.c parser.c eval.c net_runtime.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm

      - name: Install gtimeout
        run: |
          # macOS's BSD userland has no `timeout` command at all -- a
          # real gap this job's very first run caught (the compile
          # step passed; the test script's own `timeout` call is what
          # failed, with "command not found"). GNU coreutils (already
          # present via Homebrew on GitHub's macos-latest runners, just
          # not linked into PATH as the bare command names) provides it
          # as `gtimeout`.
          brew install coreutils

      - name: Native macOS smoke test — no networking at all
        run: |
          # Every single test so far has hung with zero output, even a
          # diagnostic with no loops in the generated code at all
          # (bind/socket/send, straight-line, no backward jumps
          # possible). That's a strange enough result to stop assuming
          # the bug is specifically in networking and check something
          # more basic first: does a trivial Mach-O binary with no
          # networking involved run and print anything at all on real
          # macOS? --target macos has been in this project since long
          # before any of the native networking work, but nothing in
          # this repository's history actually confirms it was ever
          # execution-tested end-to-end on a real Mac -- only compiled.
          # If THIS hangs too, the bug isn't in y.net.* at all.
          printf 'y.println("hello from macos")\ny.println(42)\n' > /tmp/macos_smoke.y
          ./ys -c /tmp/macos_smoke.y --target macos -o /tmp/macos_smoke_bin
          set +e
          out=$(gtimeout -k 5 10 /tmp/macos_smoke_bin)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "--- output ---"
          echo "$out"
          echo "--------------"
          if [ "$rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT (exit $rc) -- this has nothing to do with networking; basic macOS program execution itself is broken"
            exit 1
          fi
          echo "$out" | grep -q "^hello from macos$"
          echo "$out" | grep -q "^42$"
          rm -f /tmp/macos_smoke.y /tmp/macos_smoke_bin
          echo "PASS: macos basic program execution + print"

      - name: Native UDP diagnostic — bind/socket/send only, no recv
        run: |
          # Isolates one specific hypothesis about the full UDP test's
          # hang: bind()/socket()/send() should all return near-
          # instantly regardless of whether anything is ever actually
          # received (UDP send doesn't wait for delivery) -- if THIS
          # step also hangs, the bug is earlier than recv_reply_print;
          # if it passes cleanly, recv_reply_print's blocking recvfrom
          # (with no timeout set) is almost certainly where the full
          # test's hang actually is, which matters because that's a
          # very different kind of bug (a packet that never arrives)
          # than a stuck syscall in bind/socket/send would be.
          printf 'let srv = y.net.udp_bind(9502)\ny.println(srv)\nlet cli = y.net.udp_socket()\ny.println(cli)\nlet n = y.net.udp_send(cli, "127.0.0.1", 9502, "hello")\ny.println(n)\ny.net.udp_close(srv)\ny.net.udp_close(cli)\ny.println("diagnostic done")\n' \
            > /tmp/macos_udp_diag.y
          ./ys -c /tmp/macos_udp_diag.y --target macos -o /tmp/macos_udp_diag_bin
          set +e
          out=$(gtimeout -k 5 10 /tmp/macos_udp_diag_bin)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "--- output ---"
          echo "$out"
          echo "--------------"
          if [ "$rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT (exit $rc) -- bind/socket/send didn't all return cleanly"
            exit 1
          fi
          echo "$out" | grep -q "^0$"    # udp_bind returned a valid fd
          echo "$out" | grep -q "^1$"    # udp_socket returned a valid (different) fd
          echo "$out" | grep -q "^5$"    # udp_send reported 5 bytes ("hello")
          echo "$out" | grep -q "^diagnostic done$"
          rm -f /tmp/macos_udp_diag.y /tmp/macos_udp_diag_bin
          echo "PASS: macos udp bind/socket/send (no recv)"

      - name: Native UDP — self-contained on localhost
        run: |
          # Run before anything touching a real external host: this
          # and the next step depend on nothing but loopback, so a
          # failure here means the core socket/syscall logic itself is
          # wrong, independent of whether real internet reachability
          # from this runner is even part of the problem.
          printf 'let srv = y.net.udp_bind(9501)\nlet cli = y.net.udp_socket()\ny.net.udp_send(cli, "127.0.0.1", 9501, "hello udp macos")\ny.net.udp_recv_reply_print(srv, 100)\ny.net.udp_close(srv)\ny.net.udp_close(cli)\ny.println("udp done")\n' \
            > /tmp/macos_udp.y
          ./ys -c /tmp/macos_udp.y --target macos -o /tmp/macos_udp_bin
          set +e
          out=$(gtimeout -k 5 10 /tmp/macos_udp_bin)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "--- output ---"
          echo "$out"
          echo "--------------"
          if [ "$rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT (exit $rc) -- see output above for how far it got"
            exit 1
          fi
          echo "$out" | grep -q "hello udp macos"
          echo "$out" | grep -q "^udp done$"
          rm -f /tmp/macos_udp.y /tmp/macos_udp_bin
          echo "PASS: macos native UDP"

      - name: Native TCP server + client — self-contained on localhost
        run: |
          # Exercises listen/accept/connect/send/recv_print/close
          # together, both directions, without depending on any
          # external host being reachable at all.
          printf 'let srv = y.net.listen(9500)\ny.println(srv)\nlet conn = y.net.accept(srv)\ny.println(conn)\nif conn >= 0 {\n    y.net.recv_print(conn, 100)\n    y.net.send(conn, "server reply")\n    y.net.close(conn)\n}\n' \
            > /tmp/macos_srv.y
          printf 'let h = y.net.connect("127.0.0.1", 9500)\ny.println(h)\nif h >= 0 {\n    y.net.send(h, "client hello")\n    y.net.recv_print(h, 100)\n    y.net.close(h)\n}\n' \
            > /tmp/macos_cli.y
          ./ys -c /tmp/macos_srv.y --target macos -o /tmp/macos_srv_bin
          ./ys -c /tmp/macos_cli.y --target macos -o /tmp/macos_cli_bin
          gtimeout -k 5 15 /tmp/macos_srv_bin > /tmp/macos_srv_out.txt 2>&1 &
          srv_pid=$!
          sleep 1
          set +e
          cli_out=$(gtimeout -k 5 10 /tmp/macos_cli_bin)
          cli_rc=$?
          wait $srv_pid
          srv_rc=$?
          set -e
          srv_out=$(cat /tmp/macos_srv_out.txt)
          echo "server exit code: $srv_rc"
          echo "server output: $srv_out"
          echo "client exit code: $cli_rc"
          echo "client output: $cli_out"
          if [ "$srv_rc" -ne 0 ] || [ "$cli_rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT -- see output above for how far each side got"
            exit 1
          fi
          echo "$srv_out" | grep -q "^0$"              # listen() returned a valid fd
          echo "$srv_out" | grep -q "client hello"     # server received the client's bytes
          echo "$cli_out" | grep -q "^0$"               # connect() returned a valid fd
          echo "$cli_out" | grep -q "server reply"     # client received the server's bytes
          rm -f /tmp/macos_srv.y /tmp/macos_cli.y /tmp/macos_srv_bin /tmp/macos_cli_bin /tmp/macos_srv_out.txt
          echo "PASS: macos native TCP server + client"

      - name: Native TCP connect-only smoke test — real external host
        run: |
          # Deliberately minimal (connect() and nothing else) so a hang
          # or failure here points specifically at connect() itself,
          # separate from send()/recv_print() -- those already got real
          # coverage over loopback in the previous step, so the only
          # new thing this step (and the next one) actually exercises
          # is a real routed connection over the actual internet, which
          # loopback can't test.
          printf 'let h = y.net.connect("93.184.216.34", 80)\ny.println(h)\nif h >= 0 { y.net.close(h) }\ny.println("connect-only done")\n' \
            > /tmp/macos_connect_only.y
          ./ys -c /tmp/macos_connect_only.y --target macos -o /tmp/macos_connect_only_bin
          set +e
          out=$(gtimeout -k 5 15 /tmp/macos_connect_only_bin)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "--- output ---"
          echo "$out"
          echo "--------------"
          if [ "$rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT (exit $rc) -- connect() itself is the suspect"
            exit 1
          fi
          echo "$out" | grep -q "^0$"
          echo "$out" | grep -q "^connect-only done$"
          rm -f /tmp/macos_connect_only.y /tmp/macos_connect_only_bin
          echo "PASS: macos native TCP connect (real host)"

      - name: Native TCP client — real host, real macOS syscalls
        run: |
          # IP literal, not a hostname -- hostname resolution is one of
          # the two things v2.34 explicitly didn't port to macOS (see
          # that changelog entry). 93.184.216.34 is example.com's IP.
          printf 'let h = y.net.connect("93.184.216.34", 80)\ny.println(h)\nif h >= 0 {\n    y.net.send(h, "GET / HTTP/1.0\\r\\nHost: example.com\\r\\n\\r\\n")\n    y.net.recv_print(h, 200)\n    y.net.close(h)\n}\ny.println("tcp client done")\n' \
            > /tmp/macos_tcp_client.y
          ./ys -c /tmp/macos_tcp_client.y --target macos -o /tmp/macos_tcp_client_bin
          set +e
          out=$(gtimeout -k 5 20 /tmp/macos_tcp_client_bin)
          rc=$?
          set -e
          echo "exit code: $rc"
          echo "--- output ---"
          echo "$out"
          echo "--------------"
          if [ "$rc" -ne 0 ]; then
            echo "FAILED or TIMED OUT (exit $rc) -- see output above for how far it got"
            exit 1
          fi
          echo "$out" | grep -q "^0$"        # connect() returned a valid fd
          echo "$out" | grep -qi "HTTP/1"    # a real HTTP response came back
          echo "$out" | grep -q "^tcp client done$"
          rm -f /tmp/macos_tcp_client.y /tmp/macos_tcp_client_bin
          echo "PASS: macos native TCP client"