name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          gcc -std=c11 -Wall -O2 \
            -o ys \
            lexer.c parser.c eval.c net_runtime.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm

      - name: Test — basic interpreter
        run: |
          echo 'y.println("hello")' | ./ys /dev/stdin | grep -q "hello"
          echo "y.println(1 + 2)" | ./ys /dev/stdin | grep -q "3"
          echo "y.println(2 * 21)" | ./ys /dev/stdin | grep -q "42"
          echo "PASS: basic interpreter"

      - name: Test — float arithmetic
        run: |
          echo "y.println(1.5 + 2.3)" | ./ys /dev/stdin | grep -q "3.8"
          echo "y.println(10.0 / 4.0)" | ./ys /dev/stdin | grep -q "2.5"
          echo "y.println(-3.14)" | ./ys /dev/stdin | grep -q "\-3.14"
          echo "PASS: float arithmetic"

      - name: Test — enums
        run: |
          printf 'enum Status { Ok NotFound Error }\ny.println(Status.Ok)\n' \
            | ./ys /dev/stdin | grep -q "Status.Ok"
          echo "PASS: enums"

      - name: Test — file I/O
        run: |
          printf 'y.fs.write("/tmp/ys_ci.txt","hello")\ny.println(y.fs.read("/tmp/ys_ci.txt"))\n' \
            | ./ys /dev/stdin | grep -q "hello"
          rm -f /tmp/ys_ci.txt
          echo "PASS: file I/O"

      - name: Test — JSON
        run: |
          printf 'let o = y.json.parse(`{"x":42}`)\ny.println(o.x)\n' \
            | ./ys /dev/stdin | grep -q "42"
          echo "PASS: JSON"

      - name: Test — modules (relative import)
        run: |
          echo 'fn greet(n){ y.println(n) }' > /tmp/utils_ci.y
          printf 'import "/tmp/utils_ci.y"\ngreet("ok")\n' \
            | ./ys /dev/stdin | grep -q "ok"
          rm -f /tmp/utils_ci.y
          echo "PASS: modules"

      - name: Test — process & system
        run: |
          echo 'y.println(sys.platform())' | ./ys /dev/stdin | grep -q "linux"
          echo "PASS: process & system"

      - name: Test — match + guards
        run: |
          printf 'let x = 5\nlet r = match x {\n  n if n > 3 => "big"\n  _ => "small"\n}\ny.println(r)\n' \
            | ./ys /dev/stdin | grep -q "big"
          echo "PASS: match guards"

      - name: Test — ys test command
        run: |
          # NOTE: this used to be a heredoc (cat > file << 'YSEOF' ... YSEOF)
          # with the body starting at column 0. That's invalid YAML: a
          # literal block scalar ("run: |" above) requires every line to
          # be indented at least as much as its first content line, or
          # the scalar ends early and the parser tries to read the next
          # line as a new top-level YAML key -- confirmed against two
          # independent parsers (PyYAML, js-yaml), both rejecting the
          # original file with a parse error, and matching a real,
          # publicly-documented GitHub Actions incident with this exact
          # shape (a workflow GitHub outright refused to run). Indenting
          # the heredoc body/delimiter to satisfy YAML doesn't work
          # either -- bash's own `<<'EOF'` requires the closing delimiter
          # alone on a line with no leading whitespace, so an indented
          # "YSEOF" is never recognized and the heredoc just keeps
          # consuming the rest of the step as content instead of ending.
          # printf with explicit \n, kept on one logical line, sidesteps
          # both problems at once.
          printf 'fn add(a, b) { return a + b }\ntest "add" {\n    assert_eq(add(2,3), 5)\n    assert(add(0,0) == 0)\n}\ntest "strings" {\n    assert(y.len("hello") == 5)\n}\n' \
            > /tmp/ci_test.y
          ./ys test /tmp/ci_test.y | grep -q "2 passed"
          echo "PASS: ys test"

      - name: Test — ys check command
        run: |
          printf 'let x = 10\ny.println(x)\n' > /tmp/ci_clean.y
          ./ys check /tmp/ci_clean.y | grep -q "No issues"
          echo "PASS: ys check"

      - name: Test — assert builtins
        run: |
          printf 'assert(1 == 1)\nassert_eq(2 + 2, 4)\nassert_true(true)\nassert_false(false)\ny.println("ok")\n' \
            | ./ys /dev/stdin | grep -q "ok"
          echo "PASS: assert builtins"

      - name: Test — native compiler (Linux ELF)
        run: |
          echo 'y.println("compiled!")' > /tmp/nc_test.y
          ./ys -c /tmp/nc_test.y -o /tmp/nc_test_bin
          /tmp/nc_test_bin | grep -q "compiled!"
          rm -f /tmp/nc_test.y /tmp/nc_test_bin
          echo "PASS: native compiler"

      - name: Test — native TLS public API (v2.30, real network)
        run: |
          # example.com specifically: IANA-maintained, about as stable a
          # real HTTPS target as exists, and (unlike some CDN frontends)
          # requires correct SNI to hand back a sensible response at all
          # -- see the v2.30 changelog entry for why that matters here.
          # \\r\\n below (doubled backslashes) is deliberate: printf's own
          # escape processing must turn each \\ into one literal backslash,
          # producing the literal two-character sequence \r in the
          # generated .y source, so Yolish's own string-literal lexer is
          # the thing that turns it into an actual CR byte at compile
          # time -- not printf doing that a layer too early.
          # maxlen=4000 (not the original 300): tls_recv_print is a
          # single read, by design (see the v2.31 changelog entry on why
          # the HTTP client needed its own read loop instead of reusing
          # this). A real run against example.com showed why 300 wasn't
          # enough: Cloudflare's header set plus chunked-transfer-encoding's
          # leading chunk-size line alone came close to that, cutting the
          # single read off before the actual "Example Domain" body ever
          # arrived -- a passing connect/handshake with a failing content
          # check, not a crash. 4000 leaves comfortable headroom under the
          # 4095-byte buffer cap.
          printf 'let h = y.net.tls_connect("example.com", 443)\ny.println(h)\nif h >= 0 {\n    y.net.tls_send(h, "GET / HTTP/1.1\\r\\nHost: example.com\\r\\nConnection: close\\r\\n\\r\\n")\n    y.net.tls_recv_print(h, 4000)\n    y.net.tls_close(h)\n}\n-- invalid handle must fail cleanly, not crash, on all three ops\ny.println(y.net.tls_send(99, "x"))\ny.println(y.net.tls_recv_print(99, 10))\ny.net.tls_close(99)\ny.println("done")\n' \
            > /tmp/tls_ci.y
          ./ys -c /tmp/tls_ci.y --target linux -o /tmp/tls_ci_bin
          out=$(timeout 20 /tmp/tls_ci_bin)
          echo "$out"
          echo "$out" | grep -q "^0$"              # tls_connect returned a valid handle
          echo "$out" | grep -qi "Example Domain"  # real decrypted response content
          echo "$out" | grep -q "^-1$"             # invalid-handle send/recv_print
          echo "$out" | grep -q "^done$"           # reached the end, no crash
          rm -f /tmp/tls_ci.y /tmp/tls_ci_bin
          echo "PASS: native TLS public API"

      - name: Test — bytecode VM (v2.0, experimental)
        run: |
          printf 'fn fib(n) {\n    if n <= 1 { return n }\n    return fib(n-1) + fib(n-2)\n}\ny.println(fib(10))\nlet arr = [1, 2, 3]\ny.println(arr[1])\nvar i = 0\nwhile i < 3 { i = i + 1 }\ny.println(i)\n' \
            > /tmp/vm_test.y
          ./ys vm /tmp/vm_test.y < /dev/null | grep -q "55"
          echo "PASS: bytecode VM"

      - name: Run examples
        run: |
          # </dev/null is critical: a few examples (e.g. input_and_types.y)
          # call y.input()/y.input_int()/y.input_float(), which block on
          # fread(stdin) waiting for a line. Without an explicit redirect,
          # the step inherits the runner's stdin, which may not signal EOF
          # immediately — that hung this exact job, with no error output,
          # until the workflow timed out. Forcing /dev/null guarantees an
          # instant EOF so input() returns an empty/default value instead
          # of blocking forever.
          for f in examples/*.y; do
            timeout 30 ./ys "$f" < /dev/null > /dev/null 2>&1 && echo "PASS: $f" || echo "FAIL: $f (non-zero exit)"
          done

      - name: Test — SQLite (v2.35/v2.36/v2.38, opt-in build)
        run: |
          # y.db.sqlite_* is opt-in (YS_WITH_SQLITE), same pattern as
          # y.net.tls_* -- the main `ys` built above deliberately
          # doesn't have it, so nothing in this project silently grows
          # a hard libsqlite3 dependency by default. Built as a
          # separate binary here just for this step.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev
          gcc -std=c11 -Wall -O2 -DYS_WITH_SQLITE \
            -o ys_sqlite \
            lexer.c parser.c eval.c net_runtime.c compiler.c \
            elf_out.c pe_out.c macho_out.c formatter.c checker.c \
            bytecode.c bcompiler.c vm.c main.c -lm -lsqlite3

          # Interpreter and VM: examples/db_examples/01_sqlite_basics.y
          # isn't swept by the generic "Run examples" step above (it
          # needs this flagged binary, which that step's plain `ys`
          # doesn't have), so it's run explicitly here on both paths.
          ./ys_sqlite examples/db_examples/01_sqlite_basics.y | grep -q "^done$"
          ./ys_sqlite vm examples/db_examples/01_sqlite_basics.y | grep -q "^done$"

          # Native (v2.38): sqlite_query_print needs NO build flag on
          # ys itself -- the flag only gates the interpreter/VM's own
          # linked-in libsqlite3 calls. A --target linux compiled
          # binary dynamically links libsqlite3.so.0 at ITS runtime
          # regardless of how ys was built, so this uses the plain
          # `ys` from the Build step above, not ys_sqlite.
          rm -f /tmp/ci_sqlite_native.db
          printf 'let db = y.db.sqlite_open("/tmp/ci_sqlite_native.db")\ny.db.sqlite_exec(db, "CREATE TABLE t(id INTEGER PRIMARY KEY, name TEXT)")\ny.db.sqlite_exec(db, "INSERT INTO t(name) VALUES (%s)")\ny.db.sqlite_query_print(db, "SELECT * FROM t")\ny.db.sqlite_close(db)\n' "'native-ci'" \
            > /tmp/sqlite_native_ci.y
          ./ys -c /tmp/sqlite_native_ci.y --target linux -o /tmp/sqlite_native_ci_bin
          out=$(/tmp/sqlite_native_ci_bin)
          echo "$out"
          echo "$out" | grep -q "^name=native-ci$"
          rm -f /tmp/sqlite_native_ci.y /tmp/sqlite_native_ci_bin /tmp/ci_sqlite_native.db
          echo "PASS: SQLite (interpreter, VM, native)"

      - name: Test — PostgreSQL (v2.37, real local server)
        run: |
          # y.db.pg_* needs no build flag (no external library at
          # all -- the wire protocol is implemented from scratch in
          # net_runtime.c), but it does need a real server to talk
          # to. Installed and configured here to match what
          # examples/db_examples/02_postgres_basics.y expects.
          sudo apt-get install -y -qq postgresql
          sudo service postgresql start

          # MD5 auth specifically (not the PostgreSQL 14+ default,
          # SCRAM-SHA-256 -- see net_runtime.h's ys_db_pg_connect
          # comment for why that's not supported yet). Setting
          # password_encryption before (re-)setting the password is
          # required: pg_hba.conf saying "md5" does not retroactively
          # make an existing SCRAM-stored credential MD5-compatible.
          sudo -u postgres psql -c "SET password_encryption = 'md5'; ALTER USER postgres PASSWORD 'testpass';"
          sudo -u postgres psql -c "CREATE DATABASE ysdb;"
          PG_HBA=$(sudo -u postgres psql -tAc "SHOW hba_file;")
          sudo sed -i 's/^host    all             all             127.0.0.1\/32            scram-sha-256/host    all             all             127.0.0.1\/32            md5/' "$PG_HBA"
          sudo -u postgres psql -c "SELECT pg_reload_conf();"

          ./ys examples/db_examples/02_postgres_basics.y | grep -q "^done$"
          ./ys vm examples/db_examples/02_postgres_basics.y | grep -q "^done$"
          echo "PASS: PostgreSQL (interpreter, VM, real server)"

      - name: Windows cross-compile sanity check
        run: |
          # Not a behavior test (nothing here can run a PE32+ binary on a
          # Linux runner) -- just confirms `make windows` still produces a
          # valid Windows executable. v2.26's whole changelog entry is a
          # build fix for exactly this silently breaking (a Linux-only
          # header pulled in by code that gets compiled for every target
          # regardless of what it emits) -- same risk any new native
          # builtin, TLS included, reintroduces if it isn't checked here.
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
          make windows
          file ys.exe | grep -q "PE32+"
          echo "PASS: windows cross-compile"